<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The webfonts are self-hosted (src/fonts.css, public/fonts/). This
         used to be a preconnect pair and a stylesheet <link> to
         fonts.googleapis.com, which meant every visitor's browser contacted
         Google before login and before any Calendar choice -- while the
         Privacy Policy said nothing is sent to Google without a connected
         account. See src/fonts.css for the whole reasoning; do not
         reintroduce a remote font host without changing that text too. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#1A1410" />
    <title>Uncle Owen</title>
    <script>
      // Stamps the scenery choice before first paint. Without this, everyone
      // on `twin-suns` watches the homestead paint and then vanish on every
      // single load -- the setting is read in React, which runs after the
      // first frame. Cheap, and invisible until it is missing.
      //
      // Duplicated from src/lib/scenery.ts on purpose: this has to run before
      // the bundle exists, so it cannot import from it. Keep the two in sync.
      (function () {
        var v = 'homestead';
        try {
          var s = localStorage.getItem('uo.scenery');
          v =
            s === 'twin-suns' || s === 'homestead'
              ? s
              : matchMedia('(prefers-contrast: more)').matches
                ? 'twin-suns'
                : 'homestead';
        } catch (e) {
          /* storage blocked -- the default is already correct */
        }
        document.documentElement.dataset.scenery = v;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
