# Typecheck and test both halves of the repo on every push and pull request.
#
# This runs unconditionally -- unlike the deploy workflows, which are opt-in --
# because the whole point is to catch a regression before it reaches the
# deploy step, not after.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Actions are pinned by major version, and that is a deliberate choice rather
# than a default (IDEAS.md item 25). The alternative -- pinning to a commit SHA
# -- is what a supply-chain-conscious repo does, and it is genuinely stronger:
# a major tag is mutable, so `@v5` today and `@v5` next month need not be the
# same code. It is also a standing maintenance cost, because every action then
# needs a SHA bump for every patch release, forever, on a repo maintained by
# one person in their spare time.
#
# Pinned by major, the cost is instead one bump every couple of years, at a
# moment of GitHub's choosing. That is the trade being made knowingly: these
# workflows deploy a hobby scheduler for a friend group, and the realistic
# threat is a broken deploy on the day a release is already blocked, not a
# compromised upstream action.
#
# What the choice obliges us to do is bump *early*. v4 -> v5 here was
# deprecation-warning-only for months (GitHub forced those actions onto Node 24
# and said so on every run) and would have become a hard failure the day the
# substitution stopped -- the exact "trivial now, emergency later" shape.
jobs:
  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # Node 22, not 20: the pinned Wrangler declares an engine of
          # >=22.0.0, and the test harness uses the built-in node:sqlite
          # module. Building on 20 was building against a toolchain the
          # lockfile doesn't actually support.
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      # `npm ci` installs exactly what package-lock.json resolves, so CI
      # tests the same dependency tree that gets deployed. `npm install` is
      # free to pick up newer versions and quietly drift from it.
      - name: Install dependencies
        working-directory: worker
        run: npm ci

      - name: Typecheck
        working-directory: worker
        run: npm run typecheck

      - name: Test
        working-directory: worker
        run: npm test

      # Guardrail 1 (docs/specs/0002-sandbox-and-promotion.md): fails the
      # build if wrangler.toml's [vars] and [env.sandbox.vars] ever drift out
      # of the same key set, WORKERS_PLAN differs between them, or the
      # sandbox's D1 database_id is ever set to production's -- catching all
      # three here rather than at deploy time, or not at all.
      - name: Check sandbox/production config parity
        working-directory: worker
        run: npm run check:env-parity

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # `npm run build` runs `tsc -b` before Vite, so this covers typechecking
      # and the production bundle in one step.
      - name: Build
        working-directory: frontend
        run: npm run build

      # The frontend holds one piece of genuinely security-relevant logic --
      # the pending logout revocation queue, which is what makes "log out"
      # mean the session is actually revoked rather than just forgotten
      # locally. It gets tested rather than only typechecked.
      - name: Test
        working-directory: frontend
        run: npm test
