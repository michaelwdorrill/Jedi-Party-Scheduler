# Builds and deploys the sandbox Worker + D1 database -- a second, isolated
# deployment to verify a change against a real Worker, a real D1 database and
# a real Discord bot before it reaches production, without touching
# production data or DMing a real user. See
# docs/specs/0002-sandbox-and-promotion.md.
#
# Two ways to fire it: automatically on push to a `sandbox` branch (merging a
# feature branch into `sandbox` is the day-to-day workflow), or manually via
# workflow_dispatch against any branch -- including one that hasn't been
# merged into `sandbox` yet, via the `branch` input below.
#
# Setting `environment: sandbox` on the job records a GitHub Deployment
# against the commit this run built. That's the data source
# deploy-worker.yml's advisory check (Guardrail 3) reads to answer "was this
# commit sandboxed first?" -- nothing else in this workflow needs to call the
# Deployments API directly.

name: Deploy Sandbox

on:
  push:
    branches: [sandbox]
    paths:
      - 'worker/**'
      - '.github/workflows/deploy-sandbox.yml'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build and deploy (defaults to the branch this workflow is dispatched from)'
        required: false
        type: string

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: sandbox
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.branch || github.ref }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install dependencies
        working-directory: worker
        run: npm ci

      - name: Typecheck
        working-directory: worker
        run: npm run typecheck

      - name: Test
        working-directory: worker
        run: npm test

      # Same ordering rule as production (see deploy-worker.yml): migrate
      # before deploy, so the currently-deployed sandbox Worker is never left
      # running against code that expects a column the schema doesn't have
      # yet.
      - name: Apply D1 migrations
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply jedi-party-scheduler-db-sandbox --remote --env sandbox

      # Guardrail 2: fails the deploy if the sandbox database's real schema
      # doesn't match what worker/migrations/*.sql should have produced,
      # rather than trusting d1_migrations' own bookkeeping alone -- see
      # scripts/verify-schema.mjs and docs/SETUP.md's schema-drift incidents
      # for why that bookkeeping isn't enough by itself. Doing this here is
      # what makes the sandbox useful for this specific failure mode: drift
      # surfaces against synthetic data, before the same migration reaches
      # production.
      - name: Verify sandbox schema matches migrations
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run db:verify -- --remote --env sandbox

      - name: Deploy
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy:sandbox
