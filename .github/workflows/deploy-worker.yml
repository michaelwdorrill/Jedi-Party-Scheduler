# Auto-deploys the Cloudflare Worker on push to main, using the
# CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID repo secrets. See
# docs/SETUP.md for the full checklist.

name: Deploy Worker

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install dependencies
        working-directory: worker
        run: npm ci

      - name: Typecheck
        working-directory: worker
        run: npm run typecheck

      # Never deploy a Worker whose tests don't pass.
      - name: Test
        working-directory: worker
        run: npm test

      # Before the deploy, not after: the new code may depend on a column the
      # migration adds, and there is no moment where it is running against a
      # database that lacks one.
      #
      # That ordering is only safe while migrations stay backwards-compatible
      # with the *currently deployed* code, because between this step and the
      # next one the old Worker is briefly running against the new schema.
      # Adding columns, tables and indexes is fine. Dropping or renaming a
      # column the live Worker still reads is not -- split that into two
      # releases (stop reading it, then drop it) rather than relying on the
      # few seconds between these steps.
      #
      # `d1 migrations apply` records what it has run in a d1_migrations table
      # on the database, so this is a no-op on a deploy that adds none.
      - name: Apply D1 migrations
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply jedi-party-scheduler-db --remote

      - name: Deploy
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy
