name = "jedi-party-scheduler-worker"
main = "src/index.ts"
compatibility_date = "2024-09-25"
compatibility_flags = ["nodejs_compat"]

# Pinning this avoids Wrangler needing an "list accounts" API call (and thus
# a broader token permission) to figure out which account to use.
account_id = "f22e4f3ece3f69c4bd0da97be4f7a3b6"

# Non-secret configuration. Secrets (DISCORD_CLIENT_SECRET, DISCORD_BOT_TOKEN,
# JWT_SIGNING_KEY) are NOT set here — see docs/SETUP.md, they're set via
# `wrangler secret put` and never committed.
[vars]
DISCORD_CLIENT_ID = "1531128508728737812"
FRONTEND_URL = "https://uncleowen.space"
OWNER_DISCORD_ID = "346042183486537730"
# The production Discord application's public key, which verifies that an
# inbound interaction really came from Discord (docs/specs/0010). Not a
# secret: it verifies signatures, it cannot make them. One-time manual step --
# copy it from the Discord developer portal (General Information -> Public
# Key) for THIS application, and note that the sandbox has a different one
# because it is a different application. Until it is set, the interactions
# endpoint rejects everything with a 401, which is the safe direction to fail.
DISCORD_PUBLIC_KEY = ""
# Which Cloudflare plan this Worker runs on: "free" or "paid". Free and Paid
# differ by more than an order of magnitude in D1 queries and outbound
# subrequests allowed per invocation, and the 15-minute cron sizes its own
# work budget from this (see src/cron/budget.ts). Leave it as "free" unless
# the account is actually on Workers Paid -- overstating it means the sweep
# gets killed by the platform mid-send instead of deferring cleanly.
WORKERS_PLAN = "free"

[[d1_databases]]
binding = "DB"
database_name = "jedi-party-scheduler-db"
database_id = "0f106451-de8f-4623-be4a-86cbf407d58b"
# Wrangler applies these in filename order and records each one it has run in
# a `d1_migrations` table on the database itself, so re-running only applies
# what is new. That tracking is what lets CI migrate automatically on deploy;
# the hand-rolled script this replaced re-ran whatever you pointed it at and
# left you to remember where you'd got to.
migrations_dir = "migrations"

# Runs the reminder/poll-resolution sweep every 15 minutes.
[triggers]
crons = ["*/15 * * * *"]

# A second, isolated deployment to build and test against instead of building
# directly in prod (docs/specs/0002-sandbox-and-promotion.md). Same Cloudflare
# account -- the isolation that matters is the *data* (a separate D1 database)
# and the *bot* (a separate Discord application), not a separate account.
#
# Wrangler does NOT inherit top-level [vars] or bindings (D1, cron triggers)
# into a named environment -- only plain top-level settings like `main`,
# `compatibility_date` and `account_id` carry through automatically. Every
# var, every D1 binding and the cron trigger are redeclared below for exactly
# that reason; scripts/check-env-parity.mjs (run in CI) fails the build if
# [vars] and [env.sandbox.vars] ever drift out of the same key set, so this
# doesn't have to be caught by hand.
[env.sandbox]
name = "jedi-party-scheduler-worker-sandbox"

[env.sandbox.vars]
# One-time manual step: create a second Discord application + bot (see
# docs/SETUP.md's sandbox section) and paste its client id here.
DISCORD_CLIENT_ID = "1534208528930046044"
# The sandbox frontend is `npm run dev`, not a second Pages deployment -- the
# Worker is the OAuth redirect target and redirects back to whatever
# FRONTEND_URL says (see ARCHITECTURE.md's auth section), so pointing this at
# localhost is what makes login work against the sandbox without provisioning
# a second static site.
FRONTEND_URL = "http://localhost:5173"
# Same owner account as production -- see spec 0002's open question 2.
OWNER_DISCORD_ID = "346042183486537730"
# The *sandbox* Discord application's public key -- deliberately not
# production's. Pasting production's here would let the sandbox Worker accept
# interactions signed for the production bot. check:env-parity only proves the
# key exists in both blocks; that they hold different values is on whoever
# fills them in.
DISCORD_PUBLIC_KEY = ""
# Kept identical to production's [vars] on purpose: the whole point of the
# sandbox is to exercise the cron's budget logic (src/cron/budget.ts) under
# the same ceiling prod runs under, not a more generous one.
WORKERS_PLAN = "free"

[[env.sandbox.d1_databases]]
binding = "DB"
database_name = "jedi-party-scheduler-db-sandbox"
# One-time manual step: `wrangler d1 create jedi-party-scheduler-db-sandbox`
# and paste the resulting id here. Deliberately left as an obvious
# placeholder rather than prod's id -- check-env-parity.mjs would refuse to
# proceed if this ever matched production's database_id, since that would
# mean a sandbox deploy migrating and writing straight into prod.
database_id = "0ecf1516-3a7b-4c77-8326-e093e4ac57c8"
migrations_dir = "migrations"

# The sandbox keeps the same 15-minute cron the production Worker runs --
# the cron (budget, cursors, outbox) is the part most worth de-risking before
# it touches real data, so a sandbox that can't exercise it de-risks the
# wrong half of the app.
[env.sandbox.triggers]
crons = ["*/15 * * * *"]
